<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="script.js" defer> </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!--
    uhhhhh
    okay
    ui
    pretend this is going to be a website people actually use
    
    having the basic filters (name, category) always visible
    some of the more "advanced" filters be in some menu?
    
    -->
    
    <h1>Current Events</h1>
    <p class="subtitle">Coe has a range of events to suit a variety of interests. Search and see what catches your eye!</p>
    
    <p id="filterLabel">Filter by...</p>
    <label>
        Event Name:
        <input type="text" id="nameInput">
    </label>
    <div></div>
    <label>
        Event Organizer:
        <input type="text" id="organizerInput">
    </label>
    <div></div>
    <label>
        Event Category:
        <input type="text" id="categoryInput">
    </label>
    
    <div></div>
    
    <button id="clearButton" class="button_clear">Clear active filters</button>
    
    <hr>
    
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Description</th>
                <th>Organizer</th>
                <th>Category</th>
                <th>RSVP Count</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    
    <p id="averageRSVPCount"></p>

</body>
</html>
